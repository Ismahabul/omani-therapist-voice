<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMANI-Therapist-Voice</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #003366; }
        p { color: #555; }
        #recordBtn { background-color: #d9534f; color: white; border: none; padding: 20px; font-size: 18px; border-radius: 50%; width: 100px; height: 100px; cursor: pointer; transition: background-color 0.3s; }
        #recordBtn.recording { background-color: #5bc0de; }
        #status { margin-top: 20px; font-size: 1.2em; color: #333; height: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Elile Al Task</h1>
        <p>Your Voice-Only Mental Health Companion</p>
        <button id="recordBtn">Press to Talk</button>
        <div id="status">Press the button and start speaking.</div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
